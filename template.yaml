AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Private YouTube audio library - Angular, Cognito, API and on-demand CPU container

Parameters:
  StemImageUri:
    Type: String
    Description: ECR URI of the separately built CPU Demucs image
  InitialPasswordSecretName:
    Type: String
    Default: youtube-audio-library/registration-password
    Description: Secrets Manager secret containing the initial permanent password as plain text

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  AudioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [GET, HEAD, POST]
            AllowedHeaders: ['*']
            ExposedHeaders: [Accept-Ranges, Content-Range, Content-Length]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireStemInputs
            Status: Enabled
            Prefix: stem-inputs/
            ExpirationInDays: 1
  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt AudioBucket.Arn, !Sub '${AudioBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false
  Jobs:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: jobId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByCreatedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  Worker:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: backend
      Dockerfile: Dockerfile
      DockerTag: cpu-v1
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: 2
      EphemeralStorage:
        Size: 1024
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 60
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          TABLE_NAME: !Ref Jobs
          BUCKET_NAME: !Ref AudioBucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Jobs.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${AudioBucket.Arn}/users/*'
  Api:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend
      Handler: api.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref Jobs
          BUCKET_NAME: !Ref AudioBucket
          WORKER_NAME: !Ref Worker
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt Jobs.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: [!GetAtt Jobs.Arn, !Sub '${Jobs.Arn}/index/ByCreatedAt']
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt Worker.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${AudioBucket.Arn}/users/*'
      Events:
        CreateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/jobs
            Method: POST
        ListJobs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/jobs
            Method: GET
  StemApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend
      Handler: stem-api.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref Jobs
          BUCKET_NAME: !Ref AudioBucket
          STEM_STATE_MACHINE: !Ref StemWorkflow
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
              Resource: !GetAtt Jobs.Arn
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref StemWorkflow
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub '${AudioBucket.Arn}/stem-inputs/*'
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${AudioBucket.Arn}/users/*'
            # Deliberately excludes users/*/stems/*: original stems cannot be deleted here.
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub '${AudioBucket.Arn}/users/*/restored/*'
            # Lets HEAD on a missing upload return 404 instead of 403.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt AudioBucket.Arn
      Events:
        Upload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/stems/uploads
            Method: POST
        Complete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/stems/jobs/{jobId}/complete
            Method: POST
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/stems/jobs/{jobId}
            Method: GET
        CreateRestoration:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/stems/jobs/{jobId}/restorations
            Method: POST
        DeleteRestoration:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/stems/jobs/{jobId}/restorations/{restorationId}
            Method: DELETE
  StemVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.83.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  StemGateway:
    Type: AWS::EC2::InternetGateway
  StemGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref StemVpc
      InternetGatewayId: !Ref StemGateway
  StemSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StemVpc
      CidrBlock: 10.83.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  StemRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StemVpc
  StemSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref StemSubnet
      RouteTableId: !Ref StemRouteTable
  StemInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: StemGatewayAttachment
    Properties:
      RouteTableId: !Ref StemRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref StemGateway
  StemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only stem worker
      VpcId: !Ref StemVpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  StemCluster:
    Type: AWS::ECS::Cluster
  StemLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  StemExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
  StemTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StemStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt Jobs.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${AudioBucket.Arn}/stem-inputs/*'
                  - !Sub '${AudioBucket.Arn}/users/*/stems/*'
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${AudioBucket.Arn}/users/*/restored/*'
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${AudioBucket.Arn}/users/*/stems/*'
  StemTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '4096'
      Memory: '16384'
      ExecutionRoleArn: !GetAtt StemExecutionRole.Arn
      TaskRoleArn: !GetAtt StemTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: stems
          Image: !Ref StemImageUri
          Essential: true
          Environment:
            - Name: TABLE_NAME
              Value: !Ref Jobs
            - Name: BUCKET_NAME
              Value: !Ref AudioBucket
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: OMP_NUM_THREADS
              Value: '4'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref StemLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: separation
  StemFinalize:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend
      Handler: stem-worker.finalize
      Runtime: nodejs22.x
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref Jobs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt Jobs.Arn
  StemWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition:
        StartAt: Separate
        TimeoutSeconds: 7200
        States:
          Separate:
            Type: Task
            Resource: arn:aws:states:::ecs:runTask.sync
            TimeoutSeconds: 6900
            Parameters:
              LaunchType: FARGATE
              Cluster: !GetAtt StemCluster.Arn
              TaskDefinition: !Ref StemTask
              NetworkConfiguration:
                AwsvpcConfiguration:
                  AssignPublicIp: ENABLED
                  Subnets: [!Ref StemSubnet]
                  SecurityGroups: [!Ref StemSecurityGroup]
              Overrides:
                ContainerOverrides:
                  - Name: stems
                    Environment:
                      - Name: STEM_JOB
                        Value.$: States.JsonToString($)
            ResultPath: null
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: Finalize
            Next: Finalize
          Finalize:
            Type: Task
            Resource: !GetAtt StemFinalize.Arn
            Retry:
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            End: true
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ecs:RunTask
              Resource: !Ref StemTask
            - Effect: Allow
              Action: [ecs:StopTask, ecs:DescribeTasks]
              Resource: '*'
              Condition:
                ArnEquals:
                  ecs:cluster: !GetAtt StemCluster.Arn
            - Effect: Allow
              Action: iam:PassRole
              Resource: [!GetAtt StemTaskRole.Arn, !GetAtt StemExecutionRole.Arn]
              Condition:
                StringEquals:
                  iam:PassedToService: ecs-tasks.amazonaws.com
            - Effect: Allow
              Action: [events:PutTargets, events:PutRule, events:DescribeRule]
              Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule'
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt StemFinalize.Arn
  AccountSessions:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  Accounts:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend
      Handler: accounts.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          ACCOUNT_SESSIONS_TABLE: !Ref AccountSessions
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          INITIAL_PASSWORD_SECRET: !Ref InitialPasswordSecretName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt AccountSessions.Arn
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${InitialPasswordSecretName}-*'
      Events:
        Session:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/accounts/session
            Method: POST
            Auth:
              Authorizer: NONE
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/accounts/register
            Method: POST
            Auth:
              Authorizer: NONE
        ForgotPassword:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/accounts/forgot-password
            Method: POST
            Auth:
              Authorizer: NONE
        ConfirmPassword:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/accounts/confirm-password
            Method: POST
            Auth:
              Authorizer: NONE
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        'POST /api/accounts/session':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'POST /api/accounts/register':
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        'POST /api/accounts/forgot-password':
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        'POST /api/accounts/confirm-password':
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        AllowOrigins: ['http://localhost:4200']
        AllowHeaders: [Authorization, Content-Type, X-Account-Session]
        AllowMethods: [GET, POST, OPTIONS]
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  WebsiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-website'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  NoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-no-cache'
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
  Website:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: Static
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebsiteAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: Api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: Static
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: Api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /config.json
            TargetOriginId: Static
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCachePolicy
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Website}'
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt WebsiteBucket.Arn, !Sub '${WebsiteBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  StemStateMachineArn:
    Value: !Ref StemWorkflow
  WebsiteUrl:
    Value: !Sub 'https://${Website.DomainName}'
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  DistributionId:
    Value: !Ref Website
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/api'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AudioBucketName:
    Value: !Ref AudioBucket
  JobsTableName:
    Value: !Ref Jobs
